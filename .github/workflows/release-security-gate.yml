name: Release security gate

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  independent-review:
    name: Cryptographic and protocol review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/check-independent-review.test.mjs
      - name: Require completed independent review
        run: node scripts/check-independent-review.mjs --require-completed
