name: Publish gateway authorizer image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/intelliger-ai/oati-envoy-authorizer

jobs:
  security-gate:
    name: Require completed independent review
    uses: ./.github/workflows/release-security-gate.yml

  production-smoke:
    name: Require healthy hosted trust service
    uses: ./.github/workflows/production-smoke.yml

  publish:
    name: Publish approved immutable image
    needs: [security-gate, production-smoke]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: gateway-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/envoy-authorizer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Publish immutable deployment reference
        run: echo '${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
