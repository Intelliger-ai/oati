name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-resilience:
    name: Bounded fuzz and resilience corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with: { go-version-file: go.work }
      - run: pnpm install --frozen-lockfile
        working-directory: sdk/typescript
      - run: pnpm build
        working-directory: sdk/typescript
      - run: node --test test/resilience.test.mjs
        working-directory: sdk/typescript
      - run: go test ./cmd/oati -run 'TestBoundedAdversarialCLIInputs|FuzzCLIArgumentParser|FuzzCanonicalJSON|FuzzEvaluatorStrings'
        working-directory: cli

  sdk-and-conformance:
    name: SDKs, schemas, examples, conformance, generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            cli/go.mod
            sdk/go/go.mod
      - run: pnpm install --frozen-lockfile
        working-directory: sdk/typescript
      - run: pnpm test
        working-directory: sdk/typescript
      - run: node --test services/envoy-authorizer/server.test.mjs
      - run: docker build -f services/envoy-authorizer/Dockerfile -t oati-envoy-authorizer:test .
      - run: ./integrations/envoy/test/integration.sh
      - run: python -m pip install .
        working-directory: sdk/python
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s . -p 'test*.py' -v
        working-directory: sdk/python
      - run: go test ./...
        working-directory: sdk/go
      - run: node --test conformance/check-reports.test.mjs
      - run: ./conformance/run-all.sh
      - run: node --test scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs
      - run: node scripts/test-doc-journeys.mjs
      - run: node scripts/build-schema-site.mjs
      - run: ./scripts/check-generated.sh
      - run: node --test scripts/check-independent-review.test.mjs
      - run: node scripts/check-independent-review.mjs
      - run: docker compose -f sandbox/compose.yaml config --quiet
      - run: ./sandbox/oati-sandbox test
      - if: always()
        run: ./sandbox/oati-sandbox down

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: cli/go.mod
      - run: go test ./...
        working-directory: cli

  api-contracts:
    name: OpenAPI and platform compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - run: ruby scripts/validate-openapi.rb
      - run: node scripts/check-compatibility.mjs
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npx --yes @redocly/cli@1.34.5 lint api/lookup.openapi.yaml compatibility/platform-lookup.openapi.yaml

  licence:
    name: Apache-2.0 licence compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: sdk/typescript
      - run: node scripts/check-licenses.mjs

  dependency-security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.work }
      - run: pnpm install --frozen-lockfile
        working-directory: sdk/typescript
      - run: pnpm audit --prod --audit-level high
        working-directory: sdk/typescript
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...
        working-directory: cli
      - run: govulncheck ./...
        working-directory: sdk/go
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: Pull-request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, GPL-2.0-only, GPL-3.0-only, SSPL-1.0
