[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intelliger-oati"
version = "0.2.0.dev0"
description = "Dependency-free Python SDK for the Open Agent Trust Infrastructure"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oati = ["_schema_bundle.json"]
