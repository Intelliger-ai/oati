[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelliger-oati"
version = "0.1.0.dev0"
description = "Dependency-free Python SDK for the Open Agent Trust Infrastructure"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]
